name: Deploy to EC2

on:
  push:
    branches:
      - PROD

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, PROD]
    steps:
      - name: Checkout code
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove old files
        run: |
          sudo rm -rf /home/ec2-user/battleshipgame
          cd /home/ec2-user
          mkdir battleshipgame

      - name: Copy code to ec2
        run: |
          cp -a * /home/ec2-user/battleshipgame

      # - name: Make frontend
      #   run: |
      #     cd /home/ec2-user/battleshipgame/frontend
      #     npm i 
      #     npm run build
      #     sudo mv dist/* /var/www/html/

      - name: Make env
        run: |
          cd /home/ec2-user/battleshipgame

          echo "ENVIRONMENT=PROD" >> .env
          echo "DB_NAME=battleshipDB" >> .env
          echo "DB_USER=ronin" >> .env
          echo "DB_PASS=databasewinds" >> .env
          echo "DB_HOST=db" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_ROOT=databasewinds" >> .env
          echo "DJANGO_SECRET_KEY=4!^1d=oo0trt=$808b337zz^uy=elmwu1-y&0c6v!qct%jz9" >> .env

      - name: Execute code
        run: |
          cd /home/ec2-user/battleshipgame
          sudo docker-compose up -d --build --force-recreate

